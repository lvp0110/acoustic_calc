services:
  web:
    build:
      context: .
      target: runtime
    image: acoustic-calc:latest
    container_name: acoustic-calc
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: "3000"
      BASE_URL: ${BASE_URL:?BASE_URL must be set in .env.prod}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-1800000}
    ports:
      # Только приватный интерфейс prodfront; внешний TLS завершает gateway-01.
      - "${FRONTEND_BIND_IP:?FRONTEND_BIND_IP must be set in .env.prod}:${FRONTEND_HOST_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
